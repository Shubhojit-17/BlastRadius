name: BlastRadius Impact Assessment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  blastradius-check:
    name: Evaluate PR Blast Radius
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BlastRadius
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run BlastRadius Orchestrator
        id: blastradius
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL || 'http://localhost:8080' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_FULL_NAME: ${{ github.repository }}
          BLASTRADIUS_USE_MOCK: 'true'
        run: |
          python -m blastradius.github_action

      - name: Post or Update PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'blastradius_pr_comment.md';
            if (!fs.existsSync(reportPath)) return;

            const commentBody = fs.readFileSync(reportPath, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number
            });
            const botComment = comments.data.find(c => c.body && c.body.includes('BlastRadius PR Assessment'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: botComment.id, body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: commentBody
              });
            }
