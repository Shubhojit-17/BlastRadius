[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
version = "0.1.0"
description = "AI Agent & GitHub Action for Data Code PR Blast Radius & DataHub Contract Verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "BlastRadius Team" }
]
dependencies = [
    "acryl-datahub==1.6.0.15",
    "sqlglot==23.0.0",
    "pydantic>=2.10.0",
    "requests==2.32.3",
    "PyYAML==6.0.1",
    "pyjwt==2.8.0",
    "python-dotenv==1.0.1"
]

[project.scripts]
blastradius = "blastradius.orchestrator:cli_main"

[tool.setuptools.packages.find]
where = ["."]
